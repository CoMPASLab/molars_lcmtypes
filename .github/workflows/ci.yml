name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
      - run: uv build

  # Bumps the version (via python-semantic-release, reading conventional
  # commits since the last tag), pushes the version/changelog commit and
  # tag, and creates a GitHub release with the wheel and sdist attached.
  # main produces releases; develop produces -rc.N prereleases. Not
  # published to PyPI.
  release:
    needs: [test, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
      - name: Version, tag and GitHub release
        run: uv run --group release semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        run: uv run --group release semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
