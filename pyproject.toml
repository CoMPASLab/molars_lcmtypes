[project]
name = "molars-lcmtypes"
version = "0.1.0"
description = "MOLARS LCM types"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.9"
authors = [
    { name = "CoMPAS Lab" },
]
maintainers = [
    { name = "Kevin Barnard", email = "kbarnard@mbari.org" },
]
keywords = ["lcm", "robotics", "messaging", "compas", "molars"]
dependencies = [
    "compas-lcmtypes>=0.4,<0.5",
]

[project.urls]
Repository = "https://github.com/CoMPASLab/molars_lcmtypes"
"Issue Tracker" = "https://github.com/CoMPASLab/molars_lcmtypes/issues"

[build-system]
requires = ["hatchling", "lcm"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["molars_lcmtypes"]
# Generated (and git-ignored), so it must be listed explicitly
artifacts = ["molars_lcmtypes/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["/*/**/*.lcm", "/hatch_build.py", "/generate.py", "/README.md", "/LICENSE.txt"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
dependencies = ["lcm"]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "lcm>=1.5.3",
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "ruff>=0.17,<0.18",
]
release = [
    "python-semantic-release>=10.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
extend-exclude = ["molars_lcmtypes"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
allow_zero_version = true
major_on_zero = false
build_command = """
    uv lock --upgrade-package molars-lcmtypes
    git add uv.lock
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
